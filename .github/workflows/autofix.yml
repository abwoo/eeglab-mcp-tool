name: Autofix

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.head_ref != 'main'
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: eeglab_mcp_server/pyproject.toml

      - name: Install the formatter and linter
        run: python -m pip install -e ./eeglab_mcp_server[dev]

      - name: Apply black and ruff autofixes
        run: |
          python -m black eeglab_mcp_server scripts
          python -m ruff check eeglab_mcp_server scripts --fix || true

      - name: Commit what changed
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply black and ruff autofixes"
          git push origin "HEAD:${{ github.head_ref }}"